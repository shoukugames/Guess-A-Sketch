name: Windows build

# Builds the Windows .exe on GitHub's Windows machines (no Wine needed).
#   - every push to main: the .exe is kept as a download on the run's page for 30 days
#   - a tag such as v1.2.3: the .exe is also attached to that GitHub release
#   - or start it by hand: Actions -> Windows build -> Run workflow
# The .exe is not code-signed: building on GitHub doesn't sign it, so Windows SmartScreen can
# still warn about it until a code-signing certificate is added.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      PYGAME_HIDE_SUPPORT_PROMPT: "1"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install build tools
        run: |
          python -m pip install pygame==2.6.1 pyinstaller==6.20.0
      - name: Build
        run: |
          ROOT="$(cygpath -m "$PWD")"
          VERSION="$(python packaging/version_info.py)"
          NAME="GuessASketch-$VERSION-win64"
          BUILD=build/windows
          mkdir -p "$BUILD" dist
          python packaging/version_info.py --winfile "$BUILD/version_info.txt"
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name "$NAME" \
            --distpath "$BUILD/dist" --workpath "$BUILD/work" --specpath "$BUILD" \
            --icon "$ROOT/assets/icons/icon.ico" --version-file "$ROOT/$BUILD/version_info.txt" \
            --add-data "$ROOT/assets;assets" --exclude-module numpy --exclude-module tkinter main.py
          cp "$BUILD/dist/$NAME.exe" "dist/$NAME.exe"
      - name: Show what was built
        run: |
          for f in dist/GuessASketch-*.exe; do
            echo "::notice title=Built $(basename "$f")::$(du -h "$f" | cut -f1), sha256 $(sha256sum "$f" | cut -d' ' -f1)"
          done
      - uses: actions/upload-artifact@v6
        with:
          name: Guess-A-Sketch-windows
          path: |
            dist/GuessASketch-*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "Windows build from GitHub Actions (not code-signed)."
          gh release upload "$GITHUB_REF_NAME" dist/GuessASketch-*.exe --clobber
